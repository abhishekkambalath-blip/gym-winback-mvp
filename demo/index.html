<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Win-Back Desk</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23ffd60a'/%3E%3Cpath d='M18 4 8 18h7l-1 10 10-14h-7z' fill='%230a0a0a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- Sign-in -->
  <main id="login" class="login" hidden>
    <form id="login-form" class="login-card">
      <div class="logo big" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M18 4 8 18h7l-1 10 10-14h-7z"/></svg></div>
      <h1>Win-Back Desk</h1>
      <p class="muted">Review and approve the messages that bring members back.</p>
      <label for="key">Access key</label>
      <input id="key" type="password" autocomplete="off" required placeholder="WEBHOOK_SECRET from your .env">
      <label for="name">Your name</label>
      <input id="name" type="text" maxlength="40" required placeholder="Shown next to every decision you make">
      <p id="login-error" class="error" role="alert"></p>
      <button class="btn primary" type="submit">Enter</button>
    </form>
  </main>

  <!-- App -->
  <div id="app" hidden>
    <header class="top">
      <div class="brand">
        <div class="logo" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M18 4 8 18h7l-1 10 10-14h-7z"/></svg></div>
        <span>WIN-BACK <b>DESK</b></span>
      </div>
      <div class="modes" aria-label="System mode">
        <span class="pill" id="mode-draft" title="Where draft messages come from"></span>
        <span class="pill" id="mode-send" title="How approved messages are delivered"></span>
      </div>
      <div class="who"><span id="who"></span><button class="link" id="logout">Sign out</button></div>
    </header>

    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" data-tab="queue">Review queue <span class="count" id="count-queue">0</span></button>
      <button role="tab" data-tab="risk">At risk</button>
      <button role="tab" data-tab="results">Results</button>
      <button role="tab" data-tab="activity">Activity</button>
    </nav>

    <main id="view" class="view" tabindex="-1" aria-live="polite"></main>

    <details class="tools">
      <summary>Demo tools</summary>
      <p class="muted">Pretend the gym software sent an event, to watch the whole flow. Nothing real is contacted.</p>
      <form id="event-form" class="row">
        <label>Member # <input id="ev-member" type="number" min="1" value="23" required></label>
        <label>Event
          <select id="ev-type">
            <option value="payment_failed">Payment failed</option>
            <option value="cancellation_request">Cancellation request</option>
            <option value="freeze_request">Freeze request</option>
            <option value="check_in">Member checked in</option>
          </select>
        </label>
        <button class="btn" type="submit">Send event</button>
        <button class="btn" type="button" id="run-nightly">Run nightly job now</button>
      </form>
    </details>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/static/mock-backend.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
